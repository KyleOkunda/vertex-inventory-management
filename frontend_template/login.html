<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertex Portal</title>

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Caveat:wght@600&amp;display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/frontend_template/assets/index.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-[#D8005A] selection:text-white min-h-screen"
  >
    <div id="root">
      <div
        class="min-h-screen bg-slate-900 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden"
      >
        <div
          class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-[#D8005A]/25 via-[#D8005A]/5 to-transparent blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute -bottom-24 right-0 w-96 h-96 bg-[#00B5E2]/15 blur-3xl pointer-events-none"
        ></div>
        <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
          <div class="text-center mb-6">
            <div
              class="inline-block p-2 rounded-2xl bg-[#D8005A] shadow-xl shadow-[#D8005A]/20 border border-white/10 mb-4 transition-transform hover:scale-[1.02]"
            >
              <img
                alt="Vertex Home Essentials Ltd. - Good Living everyday"
                class="h-16 w-auto mx-auto object-contain"
                referrerpolicy="no-referrer"
                src="/frontend_template/assets/images/vertex_logo.png"
              />
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">
              Portal Login
            </h1>
            <p class="mt-1 text-sm text-slate-300">
              Vertex Inventory Management System
            </p>
          </div>

          <div
            class="bg-white py-8 px-6 shadow-2xl rounded-2xl sm:px-8 border border-slate-200"
          >
            <form class="space-y-5">
              <div>
                <label
                  class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5"
                  >Official Email</label
                >
                <div class="relative rounded-lg shadow-xs">
                  <div
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-mail h-4 w-4"
                      aria-hidden="true"
                    >
                      <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                      <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    </svg>
                  </div>
                  <input
                    required=""
                    placeholder="johndoe@vertexhomeessentials.co.ke"
                    class="block w-full pl-9 pr-3 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#D8005A] focus:border-transparent transition-shadow"
                    type="email"
                    value=""
                  />
                </div>
              </div>
              <div>
                <label
                  class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5"
                  >Password</label
                >
                <div class="relative rounded-lg shadow-xs">
                  <div
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-lock h-4 w-4"
                      aria-hidden="true"
                    >
                      <rect
                        width="18"
                        height="11"
                        x="3"
                        y="11"
                        rx="2"
                        ry="2"
                      ></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </div>
                  <input
                    required=""
                    placeholder="••••••••••••"
                    class="block w-full pl-9 pr-10 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#D8005A] focus:border-transparent transition-shadow"
                    type="password"
                    value=""
                  /><button
                    type="button"
                    id="show-password"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 cursor-pointer"
                    aria-label="Show password"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-eye h-4 w-4"
                      aria-hidden="true"
                    >
                      <path
                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                      ></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between">
                <button
                  type="button"
                  class="text-xs font-medium text-[#00B5E2] hover:text-[#0092b8] hover:underline"
                >
                  Forgot password?
                </button>
              </div>
              <div>
                <button
                  type="submit"
                  class="w-full flex items-center justify-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-semibold text-white bg-[#D8005A] hover:bg-[#BF004D] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#D8005A] transition-all cursor-pointer disabled:opacity-60"
                >
                  <span>Enter Portal</span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-arrow-right w-4 h-4"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                  </svg>
                </button>
              </div>
            </form>
            <div
              class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500"
            >
              <span class="flex items-center gap-1.5"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-shield-check w-4 h-4 text-emerald-600"
                  aria-hidden="true"
                >
                  <path
                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
                  ></path>
                  <path d="m9 12 2 2 4-4"></path>
                </svg>
                Secure Login </span
              ><span class="font-mono text-slate-400"
                >Vertex Home Essentials</span
              >
            </div>
          </div>
          <p class="mt-6 text-center text-xs text-slate-400">
            Vertex Home Essentials Ltd. · Good Living everyday
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
